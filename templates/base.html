<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}Empower Hope{% endblock %}</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <!-- Main stylesheet -->
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
  >

  <!--
    Apply saved theme BEFORE the page is displayed.
    This prevents the page from briefly flashing
    between light and dark mode.
  -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem("eh-theme");

      if (savedTheme === "dark" || savedTheme === "light") {
        document.documentElement.setAttribute(
          "data-theme",
          savedTheme
        );
      } else {
        const prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;

        document.documentElement.setAttribute(
          "data-theme",
          prefersDark ? "dark" : "light"
        );
      }
    })();
  </script>
</head>


<body class="{% block body_class %}app-page{% endblock %}">

  <!-- =====================================================
       TOP NAVIGATION
       ===================================================== -->

  <header class="site-nav">

    <div class="site-nav-inner">

      <!-- BRAND -->
      <a href="/" class="brand">

        <span class="brand-mark" aria-hidden="true">
          <span class="dot dot-it"></span>
          <span class="dot dot-beauty"></span>
          <span class="dot dot-catering"></span>
        </span>

        <span class="brand-name">
          Empower Hope
        </span>

      </a>


      <!-- NAVIGATION LINKS -->
      <nav class="nav-links" aria-label="Main navigation">

        {% block nav_links %}
        {% endblock %}

      </nav>


      <!-- NAVIGATION ACTIONS -->
      <div class="nav-actions">

        {% block nav_user %}
        {% endblock %}


        <!-- THEME TOGGLE -->
        <button
          id="theme-toggle"
          class="icon-btn"
          type="button"
          aria-label="Switch to dark mode"
          title="Switch to dark mode"
        >

          <!-- SUN ICON -->
          <svg
            class="icon-sun"
            viewBox="0 0 24 24"
            width="19"
            height="19"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >

            <circle
              cx="12"
              cy="12"
              r="4"
            />

            <path
              d="
                M12 2v2
                M12 20v2
                M4.9 4.9l1.4 1.4
                M17.7 17.7l1.4 1.4
                M2 12h2
                M20 12h2
                M4.9 19.1l1.4-1.4
                M17.7 6.3l1.4-1.4
              "
            />

          </svg>


          <!-- MOON ICON -->
          <svg
            class="icon-moon"
            viewBox="0 0 24 24"
            width="19"
            height="19"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >

            <path
              d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"
            />

          </svg>

        </button>

      </div>

    </div>

  </header>



  <!-- =====================================================
       MAIN PAGE CONTENT
       ===================================================== -->

  <main class="page">

    {% block content %}
    {% endblock %}

  </main>



  <!-- =====================================================
       MOBILE BOTTOM NAVIGATION
       ===================================================== -->

  <nav
    class="tab-bar"
    aria-label="Mobile navigation"
  >

    {% block tabbar_items %}
    {% endblock %}

  </nav>



  <!-- =====================================================
       FLOATING ACTION BUTTON
       ===================================================== -->

  {% block fab %}
  {% endblock %}



  <!-- =====================================================
       THEME JAVASCRIPT
       ===================================================== -->

  <script
    src="{{ url_for('static', filename='theme.js') }}"
  ></script>



  <!-- =====================================================
       PAGE-SPECIFIC JAVASCRIPT
       ===================================================== -->

  {% block extra_scripts %}
  {% endblock %}

</body>

</html>
