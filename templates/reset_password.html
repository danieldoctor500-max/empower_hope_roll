<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password | Empower Hope</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page reset-page">
    <a href="/" class="auth-brand"><img class="logo-image" src="https://cdn.phototourl.com/free/2026-09-22-75c41870-91e8-4eab-adda-415cbdcc300c.jpg" alt="Empower Hope logo"><span><strong>Empower Hope</strong><small>Learning &amp; attendance</small></span></a>
    <section class="card recovery-card">
      <h1>Choose a new password</h1>
      <form id="reset-password-form">
        <input type="hidden" name="token" value="{{ token }}">
        <label>New password<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
        <button class="btn primary" type="submit">Update password</button>
      </form>
      <p id="reset-message" class="message" role="alert"></p>
    </section>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
